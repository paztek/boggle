<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Teinte de l'interface du navigateur : les deux thèmes ont la leur,
         reprises de --color-bg dans styles/tokens.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b150f" />
    <!-- iOS ne lit pas encore `display` du manifeste pour l'ajout à l'écran
         d'accueil : ces balises restent nécessaires. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Boggle" />
    <meta
      name="description"
      content="Tirage de grilles de Boggle 4x4 et 5x5 et feuille de scores. Fonctionne hors ligne, aucune donnée envoyée."
    />
    <title>Boggle — Tirage &amp; scores</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
